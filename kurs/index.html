<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Lernkurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1a18; --panel:#23211e; --panel2:#2b2925; --line:#38342e; --text:#ebe5da; --muted:#a39b8e; --dim:#7d766b;
  --ed:#161513; --accent:#9db77c; --accent-d:#7f9a60; --amber:#d9a85c; --err:#d48370; --errbg:#3a2723; --okbg:#28311f; --warnbg:#3a3121;
  --fn:#d9a85c; --str:#a9c58c; --numc:#e3b48d; --com:#7d766b; --var:#9cc1c4;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; --sans:'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55}
button{font-family:inherit;font-size:14px;cursor:pointer}
code{font-family:var(--mono);font-size:.88em;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:#f0dcc0}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header .brand{font-weight:700;font-size:15px;white-space:nowrap}
header .brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.parts{display:flex;gap:10px;flex:1;min-width:0}
.part{flex:1;min-width:0}
.part .pname{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.part.cur .pname{color:var(--text);font-weight:600}
.segs{display:flex;gap:3px}
.seg{flex:1;height:6px;border-radius:3px;background:var(--line);border:none;padding:0}
.seg.done{background:var(--accent-d)}
.seg.cur{background:var(--amber)}
.seg:hover{filter:brightness(1.25)}
main{display:grid;grid-template-columns:minmax(340px,44%) 1fr;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.scroll{overflow:auto;padding:22px 26px 30px;flex:1}
.kicker{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.badge{background:var(--panel2);border:1px solid var(--line);color:var(--amber);border-radius:999px;padding:1px 9px;font-weight:600;letter-spacing:.03em}
h2{font-size:21px;margin:2px 0 12px;line-height:1.3}
h4{margin:18px 0 6px;font-size:15px}
.scroll p{margin:0 0 10px}
.scroll ul,.scroll ol{margin:0 0 10px;padding-left:22px}
.scroll li{margin-bottom:4px}
.why{border-left:3px solid var(--amber);padding:6px 12px;background:var(--panel2);border-radius:0 6px 6px 0;color:#d8d0c2;font-size:14px}
table.vars,table.cheat{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:14px}
table.vars td,table.cheat td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.vars td:first-child,table.cheat td:first-child{white-space:nowrap;width:1%}
.ex{margin:8px 0 14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ex .exin span{white-space:pre-wrap}
.ex .exin{background:var(--ed);font-family:var(--mono);font-size:13px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ex .exout{background:#11100f;font-family:var(--mono);font-size:12.5px;padding:8px 12px;white-space:pre;overflow:auto;color:#d9d2c5}
.ex .try{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:2px 8px;font-size:12px;white-space:nowrap}
.ex .try:hover{color:var(--text);border-color:var(--muted)}
.task{margin:14px 0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.task .tlabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);font-weight:600;margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;line-height:1.45;font-size:14.5px}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.sel-ok{border-color:var(--accent);background:var(--okbg)}
.opt.sel-bad{border-color:var(--err);background:var(--errbg)}
.opt:disabled{cursor:default}
.fb{margin:12px 0;padding:11px 14px;border-radius:8px;font-size:14.5px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--okbg);border:1px solid var(--accent-d)}
.fb.bad{background:var(--errbg);border:1px solid #6b3b31}
.fb.warn{background:var(--warnbg);border:1px solid #6b5631}
.fb b.h{display:block;margin-bottom:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border-radius:7px;padding:8px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#16200d;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.numin{font-family:var(--mono);font-size:15px;background:var(--ed);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:150px}
.numin:focus{outline:2px solid var(--amber);outline-offset:0}
.hintbox{margin-top:10px;font-size:14px;color:#ddd4c4;display:none;padding:9px 12px;border:1px dashed var(--line);border-radius:7px}
.hintbox.show{display:block}
.nav{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-top:1px solid var(--line);background:var(--panel)}
.nav .pos{color:var(--muted);font-size:13px}
.right{display:grid;grid-template-rows:auto 1fr auto auto 40%;min-height:0;background:var(--ed)}
.tabbar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 6px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabbar .file{font-family:var(--mono);font-size:13px;color:var(--text)}
.tabbar .tools{display:flex;gap:6px}
.tool{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:12.5px}
.tool:hover{color:var(--text);border-color:var(--muted)}
.edwrap{position:relative;min-height:0;overflow:hidden}
.ed,.hl{position:absolute;inset:0;margin:0;padding:12px 14px 12px 52px;font-family:var(--mono);font-size:14px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;overflow:auto;tab-size:2;border:0}
.hl{pointer-events:none;color:var(--text)}
.ed{background:transparent;color:transparent;caret-color:var(--amber);resize:none;outline:none}
.ed::selection{background:#4a4336;color:transparent}
.gutter{position:absolute;left:0;top:0;bottom:0;width:40px;padding:12px 0;text-align:right;font-family:var(--mono);font-size:14px;line-height:1.6;color:#57524a;pointer-events:none;overflow:hidden;border-right:1px solid #262421}
.gutter div{padding-right:8px}
.t-fn{color:var(--fn)} .t-str{color:var(--str)} .t-num{color:var(--numc)} .t-com{color:var(--com);font-style:italic} .t-var{color:var(--var)} .t-blank{color:#16200d;background:var(--amber);border-radius:3px} .t-op{color:#c9bfae}
.runbar{display:flex;justify-content:flex-end;gap:8px;padding:8px 12px;background:var(--ed);border-top:1px solid #262421}
.conhead{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.console{overflow:auto;padding:10px 14px;font-family:var(--mono);font-size:13px;line-height:1.5;background:#11100f;white-space:pre;color:#d9d2c5}
.console .in{color:#8f887c}
.console .err{color:var(--err);white-space:pre-wrap}
.console .note{color:var(--dim);font-style:italic;white-space:pre-wrap}
.kbd{font-family:var(--mono);font-size:11px;color:var(--dim)}
.done-mark{color:var(--accent)}

.gapview{display:none;position:absolute;inset:0;overflow:auto;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:2.1}
.edwrap.gapmode .gapview{display:block}
.edwrap.gapmode .ed,.edwrap.gapmode .hl,.edwrap.gapmode .gutter{display:none}
.gapline{display:flex;gap:14px;white-space:pre-wrap}
.gln{color:#57524a;min-width:20px;text-align:right}
.gapin{font-family:var(--mono);font-size:14px;background:#2e2a22;color:#f3e3c3;border:none;border-bottom:2px solid var(--amber);border-radius:4px 4px 0 0;padding:1px 5px;margin:0 1px;outline:none;min-width:3ch}
.gapin:focus{background:#3a3328;border-bottom-color:#f0c47a}
.rflist{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.rfrow{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2)}
.rfrow.rf-ok{border-color:var(--accent-d);background:var(--okbg)}
.rfrow.rf-bad{border-color:#6b3b31;background:var(--errbg)}
.rft{display:flex;gap:10px;font-size:14.5px;line-height:1.45}
.rfl{font-weight:700;color:var(--amber);min-width:14px}
.rfbtns{display:flex;gap:6px;margin:8px 0 0 24px}
.rfb{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 12px;font-size:13px}
.rfb:hover:not(:disabled){border-color:var(--muted);color:var(--text)}
.rfb.sel{background:#3a3328;border-color:var(--amber);color:var(--text)}
.rfb:disabled{cursor:default}
.rfwhy{margin:6px 0 0 24px;font-size:13.5px;color:#ddd4c4}
.rfwhy:empty{display:none}
.src{font-size:12.5px;color:var(--dim);margin-top:10px}
.fields{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flabel{min-width:150px;font-size:14px}
.fmark{font-size:12.5px;color:var(--muted)}
.numin.ok{border-color:var(--accent)}
.numin.bad{border-color:var(--err)}
.media{margin:14px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.mlabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.mrow:first-of-type,.mlabel+.mrow{border-top:none}
.mchk{display:flex;align-items:center;cursor:pointer;padding:6px 0}
.mchk input{accent-color:#8fbf7f;width:16px;height:16px;cursor:pointer}
.mcard{display:flex;gap:10px;align-items:baseline;padding:6px 0;color:var(--text);text-decoration:none;flex:1}
.mstate{margin-left:auto;font-size:12px;color:#8fbf7f}
.mcard:hover .mtitle{text-decoration:underline}
.msrc{font-size:11.5px;font-weight:600;color:var(--amber);min-width:82px}
.mtitle{flex:1;font-size:14px}
.mdur{font-size:12.5px;color:var(--muted)}
.data{font-family:var(--mono);font-size:15px;background:var(--ed);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0 12px;color:#f0dcc0;white-space:nowrap;overflow:auto}
table.mini{border-collapse:collapse;margin:6px 0 12px;font-family:var(--mono);font-size:13.5px}
table.mini th,table.mini td{border:1px solid var(--line);padding:4px 10px;text-align:center}
table.mini th{background:var(--panel2);color:var(--muted);font-weight:500;text-align:left}
.formula{font-size:17px;text-align:center;padding:10px;margin:8px 0 12px;background:var(--panel2);border-radius:6px}
.quote{border-left:3px solid var(--line);padding:6px 12px;margin:6px 0 12px;color:#d8d0c2;font-size:14px;background:var(--panel2);border-radius:0 6px 6px 0}
.nest{font-size:14px;line-height:2;margin:6px 0 12px}
.nest span{font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:#f0dcc0}
.dim{color:var(--muted);font-size:13px}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.ch{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.ch .ct{fill:var(--muted);font-size:10px;text-anchor:middle;font-family:var(--sans)}
.ch .cl{fill:var(--text);font-size:9px;text-anchor:middle;font-family:var(--sans)}
.ch .cv{fill:var(--muted);font-size:9px;text-anchor:middle;font-family:var(--mono)}
.ch .ax{stroke:#57524a;stroke-width:1}

main{grid-template-columns:44% 56%;transition:grid-template-columns .45s ease}
main .right{transition:opacity .3s ease}
main.solo{grid-template-columns:100% 0%}
main.solo .right{opacity:0;overflow:hidden;pointer-events:none}
main.solo .scroll{max-width:860px;margin:0 auto;width:100%}
main.solo .nav{max-width:860px;margin:0 auto;width:100%}
.right.appear{animation:rin .45s ease}
@keyframes rin{from{opacity:0}to{opacity:1}}
.sess{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.sdot{width:8px;height:8px;border-radius:50%;background:#57524a}
.sdot.on{background:#8fbf7f;box-shadow:0 0 6px #8fbf7f88}
.sdot.pause{background:#d8b56a}
.stime{font-family:var(--mono);color:var(--text)}
.watch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text)}
.watch input{accent-color:#8fbf7f}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:60;box-shadow:0 8px 30px #0008;font-size:14px;max-width:92vw;flex-wrap:wrap}
.lockbox ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.lockbox h4{margin:12px 0 2px;font-size:14px}
.vidwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:4px 0 10px;border:1px solid var(--line)}
.vidwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidmeta{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.vidmeta a{color:var(--amber)}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
.lockbox{width:min(380px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.lockbox h3{margin:0 0 6px;font-size:18px}
.lockbox p{color:var(--muted);font-size:14px;margin:0 0 14px}
.lockbox input{width:100%;margin-bottom:10px}
.lockerr{color:var(--err);font-size:13px;min-height:18px}
@media (max-width: 900px){
  main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .app{height:auto;min-height:100vh}
  .left{border-right:none;border-bottom:1px solid var(--line)}
  .right{height:80vh}
  .parts .pname{display:none}
  header{flex-wrap:wrap}
  main.solo{grid-template-columns:1fr}
  main.solo .right{display:none}
}
</style>
</head>
<body>
<div class="lock" id="lock"><form class="lockbox" id="lockform"><h3>Lernkurs</h3><p>Passwort eingeben. Es wird in diesem Browser gespeichert, danach musst du es nicht mehr eingeben.</p><input class="numin" id="lockpw" type="password" autocomplete="current-password" placeholder="Passwort"><div class="lockerr" id="lockerr"></div><button class="btn primary" type="submit">Öffnen</button></form></div>
<div class="app">
  <header>
    <div class="brand" id="brand"></div>
    <div class="parts" id="parts"></div>
    <div class="sess" id="sessbar"></div>
  </header>
  <main>
    <section class="left">
      <div class="scroll" id="stepview"></div>
      <div class="nav">
        <button class="btn ghost" id="prev">Zurück</button>
        <span class="pos" id="pos"></span>
        <button class="btn primary" id="next">Weiter</button>
      </div>
    </section>
    <section class="right">
      <div class="tabbar">
        <span class="file" id="edlabel">skript.R</span>
        <div class="tools">
          <button class="tool" id="showdata" title="Erste Zeilen des Datensatzes anzeigen">Datensatz ansehen</button>
          <button class="tool" id="restart" title="Gesamten Fortschritt dieser Lektion löschen">Neu beginnen</button>
          <button class="tool" id="reset" title="Editor auf den Ausgangscode zurücksetzen">Zurücksetzen</button>
        </div>
      </div>
      <div class="edwrap">
        <div class="gutter" id="gutter"></div>
        <pre class="hl" id="hl" aria-hidden="true"></pre>
        <textarea class="ed" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        <div class="gapview" id="gapview"></div>
      </div>
      <div class="runbar">
        <span class="kbd" style="margin-right:auto;align-self:center">Strg/Cmd + Enter führt aus</span>
        <button class="btn" id="run">Ausführen</button>
        <button class="btn primary" id="check" style="display:none">Antwort prüfen</button>
      </div>
      <div class="conhead"><span>Konsole</span><button class="tool" id="clear">Leeren</button></div>
      <div class="console" id="console"></div>
    </section>
  </main>
</div>
<script>// rmini.js – kleiner R-Interpreter für Lernuebungen (Teilmenge von R)
(function (root) {
'use strict';

class RError extends Error { constructor(msg) { super(msg); this.rmsg = msg; } }

// ---------- Werte ----------
function vec(type, v, names, cls) { return { t: 'vec', type, v, names: names || null, cls: cls || null }; }
const NULLV = { t: 'null' };
function num(v, names, cls) { return vec('num', v, names, cls); }
function chr(v, names) { return vec('chr', v, names); }
function lgl(v, names) { return vec('lgl', v, names); }
// Matrix: Werte spaltenweise (wie in R), rn/cn = Zeilen-/Spaltennamen oder null
function mat(type, v, nrow, ncol, rn, cn) { return { t: 'mat', type, v, nrow, ncol, rn: rn || null, cn: cn || null }; }

// ---------- Tokenizer ----------
const OPS = ['<-', '<=', '>=', '==', '!=', '&&', '||', '[[', ']]', '%in%', '%%', '<', '>', '+', '-', '*', '/', '^', '!', '&', '|', '$', ':', '(', ')', '[', ']', ',', '=', ';', '{', '}', '~'];
function tokenize(src) {
  const toks = []; let i = 0; const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '#') { while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '\n') { toks.push({ k: 'nl' }); i++; continue; }
    if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }
    if (c === '"' || c === "'" || c === '“' || c === '”' || c === '„') {
      const q = c; const close = (q === '“' || q === '„') ? '”' : q;
      if (q !== '"' && q !== "'") throw new RError('Fehler: Du hast typografische Anführungszeichen verwendet. R braucht gerade Anführungszeichen: "');
      let j = i + 1, s = '';
      while (j < n && src[j] !== close) { if (src[j] === '\\' && j + 1 < n) { s += src[j + 1]; j += 2; } else { s += src[j]; j++; } }
      if (j >= n) throw new RError('Fehler: unerwartetes Ende der Eingabe – ein Anführungszeichen wurde nicht geschlossen.');
      toks.push({ k: 'str', v: s }); i = j + 1; continue;
    }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
      const m = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?L?/.exec(src.slice(i));
      toks.push({ k: 'num', v: parseFloat(m[0].replace(/L$/, '')) }); i += m[0].length; continue;
    }
    if (/[A-Za-z._À-ſ]/.test(c)) {
      const m = /^[A-Za-z._À-ſ][A-Za-z0-9_.À-ſ]*/.exec(src.slice(i));
      const w = m[0];
      if (w === 'TRUE' || w === 'T') toks.push({ k: 'lgl', v: true });
      else if (w === 'FALSE' || w === 'F') toks.push({ k: 'lgl', v: false });
      else if (w === 'NA') toks.push({ k: 'na' });
      else if (w === 'NULL') toks.push({ k: 'nullv' });
      else toks.push({ k: 'id', v: w });
      i += w.length; continue;
    }
    if (c === '`') { const j = src.indexOf('`', i + 1); if (j < 0) throw new RError('Fehler: Backtick nicht geschlossen'); toks.push({ k: 'id', v: src.slice(i + 1, j) }); i = j + 1; continue; }

  const names = t.names, vals = t.v, n = vals.reduce((a, b) => a + b, 0), max = Math.max(...vals);
  const cols = ['#9db77c', '#d9a85c', '#9cc1c4'];
  // Säulen
  let s1 = '<svg viewBox="0 0 200 150" class="ch"><text x="100" y="12" class="ct">Säulendiagramm</text>';
  vals.forEach((v, i) => { const h = v / max * 95; const x = 30 + i * 55; s1 += '<rect x="' + x + '" y="' + (125 - h) + '" width="34" height="' + h + '" fill="' + cols[i] + '"/><text x="' + (x + 17) + '" y="' + (121 - h) + '" class="cv">' + v + '</text><text x="' + (x + 17) + '" y="139" class="cl">' + names[i] + '</text>'; });

  // Balken

  s2 += '<line x1="62" y1="24" x2="62" y2="138" class="ax"/></svg>';
  // Kreis
  let s3 = '<svg viewBox="0 0 200 150" class="ch"><text x="100" y="12" class="ct">Kreisdiagramm</text>';
  let a0 = -Math.PI / 2; const cx = 100, cy = 80, r = 44;
  vals.map((v, i) => i).sort((a, b) => vals[b] - vals[a]).forEach(i => { const v = vals[i];
    const a1 = a0 + v / n * 2 * Math.PI; const large = (a1 - a0) > Math.PI ? 1 : 0;
    s3 += '<path d="M' + cx + ',' + cy + ' L' + (cx + r * Math.cos(a0)).toFixed(2) + ',' + (cy + r * Math.sin(a0)).toFixed(2) + ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + (cx + r * Math.cos(a1)).toFixed(2) + ',' + (cy + r * Math.sin(a1)).toFixed(2) + ' Z" fill="' + cols[i] + '" stroke="#23211e" stroke-width="1.5"/>';
    const am = (a0 + a1) / 2; s3 += '<text x="' + (cx + (r + 16) * Math.cos(am)).toFixed(1) + '" y="' + (cy + (r + 16) * Math.sin(am) + 4).toFixed(1) + '" class="cl">' + names[i] + '</text>';

  });

}

// ---------- Lernzeit-Session ----------
const HUB_API = 'https://script.google.com/macros/s/AKfycby527965MYC7xpuzDuMsJ867wvj5lUO3fpVItky-bHpHem6PknQ8ef4VaiV6KrKQ87t/exec';
const IDLE_MS = 5 * 60000, AWAY_END_MS = 30 * 60000, VIDEO_MAX_MS = 60 * 60000;
const Sess = (function () {
  const K = 'lernkurs:session', QK = 'lernkurs:queue';

  const api = { watching: false, iframeFocus: false };
  const load = () => { try { return JSON.parse(localStorage.getItem(K) || 'null'); } catch (e) { return null; } };
  const persist = () => { try { localStorage.setItem(K, JSON.stringify(cur)); } catch (e) {} };
  const minutes = c => Math.round((c.active + c.credit) / 60000);
  function newSession() { cur = { id: 'k' + Date.now(), start: Date.now(), lastActive: Date.now(), active: 0, credit: 0, steps: [], videos: [], ended: false, lesson: L.id }; sentMin = -1; persist(); }
  function row(c) { return { id: c.id, ref: L.hubRef || '', titel: 'Lernkurs: ' + L.title, kurs: L.hubKurs || '', start: c.start, ende: c.lastActive, minuten: minutes(c), quelle: 'kurs' }; }

    return now - lastInput < IDLE_MS;

  function tick() {

    if (cur && !cur.ended && now % 60000 < 1000) persist();

  }
  function end(reason) {
    if (!cur || cur.ended) return null;
    cur.ended = true; cur.endReason = reason; persist(); queue(cur);
    return cur;
  }
  function ensure() { if (!cur || cur.ended) newSession(); }
  function renderBar() {
    const el = $('sessbar'); if (!el) return;
    if (!cur || cur.ended) { el.innerHTML = '<span class="sdot off"></span><span class="stime">Keine Session</span><button class="tool" id="sessstart">Session starten</button>'; $('sessstart').onclick = () => { ensure(); lastInput = Date.now(); renderBar(); }; return; }
    const m = Math.floor((cur.active + cur.credit) / 60000), on = running();
    el.innerHTML = '<span class="sdot ' + (on ? 'on' : 'pause') + '" title="' + (on ? 'Zeit läuft' : 'Pausiert, weil du inaktiv warst oder der Tab im Hintergrund lag') + '"></span><span class="stime">' + m + ' Min.' + (on ? '' : ' · pausiert') + '</span><button class="tool" id="sessend">Session beenden</button>';

    } else {

  api.init = () => {
    cur = load();
    if (cur && !cur.ended && (Date.now() - (cur.lastActive || cur.start) > AWAY_END_MS || cur.lesson !== L.id)) { end('automatisch'); }
    if (!cur || cur.ended) newSession();
    ['keydown', 'mousedown', 'touchstart', 'wheel'].forEach(ev => document.addEventListener(ev, api.touch, { passive: true }));
    let mm = 0; document.addEventListener('mousemove', () => { const n = Date.now(); if (n - mm > 2000) { mm = n; api.touch(); } }, { passive: true });
    document.addEventListener('visibilitychange', () => {

  if (s.type === 'rf') {
    S.rf = S.rf || [];
    h += '<div class="rflist">' + s.statements.map((a, k) => '<div class="rfrow" data-rf="' + k + '"><div class="rft"><span class="rfl">' + 'ABCDE'[k] + '</span>' + a.t + '</div><div class="rfbtns"><button class="rfb' + (S.rf[k] === true ? ' sel' : '') + '" data-v="1">Richtig</button><button class="rfb' + (S.rf[k] === false ? ' sel' : '') + '" data-v="0">Falsch</button></div><div class="rfwhy"></div></div>').join('') + '</div>';
    h += '<div class="row"><button class="btn primary" id="rfcheck">Auswerten</button></div>';
    if (s.source) h += '<p class="src">Quelle: ' + esc(s.source) + '</p>';
  }
  if (s.type === 'calc') {
    S.vals = S.vals || [];
    h += '<div class="task"><div class="tlabel">Aufgabe</div>' + s.task + '<div class="fields">' + s.fields.map((f, k) => '<label class="field"><span class="flabel">' + f.label + '</span><input class="numin" data-f="' + k + '" inputmode="decimal" autocomplete="off" value="' + esc(S.vals[k] || '') + '"><span class="fmark" data-fm="' + k + '"></span></label>').join('') + '</div>';
    h += '<div class="row" style="margin-top:10px"><button class="btn primary" id="calccheck">Prüfen</button><button class="btn" id="hintbtn">Hinweis</button></div><div class="hintbox" id="hint">' + s.hint + '</div></div>';
  }
  if (s.type === 'code' || s.type === 'num' || s.type === 'gap') {
    h += '<div class="task"><div class="tlabel">Aufgabe</div>' + s.task;
    if (s.type === 'num') h += '<div class="row" style="margin-top:10px"><input class="numin" id="numin" inputmode="decimal" placeholder="Antwort" autocomplete="off"><button class="btn primary" id="numcheck">Antwort prüfen</button></div>';
    h += '<div class="row" style="margin-top:10px"><button class="btn" id="hintbtn">Hinweis</button>' + (s.hint2 ? '<button class="btn" id="hint2btn" style="display:none">Zweiter Hinweis</button>' : '') + (s.solution ? '<button class="btn ghost" id="solbtn" style="display:none">Lösung zeigen</button>' : '') + '</div>';
    h += '<div class="hintbox" id="hint">' + s.hint + '</div>' + (s.hint2 ? '<div class="hintbox" id="hint2">' + s.hint2 + '</div>' : '') + '</div>';
  }
  h += '<div class="fb" id="fb"></div>';
  $('stepview').innerHTML = h;
  $('stepview').scrollTop = 0;

  document.querySelectorAll('.ex').forEach(div => {
    const code = div.getAttribute('data-code');
    const res = R.run(code, freshEnv());
    const out = res.lines.filter(l => l.type !== 'in').map(l => l.text).join('\n');
    div.innerHTML = '<div class="exin"><span>' + highlight(code).replace(/\n$/, '') + '</span><button class="try">Rechts ausprobieren</button></div><div class="exout">' + esc(out) + '</div>';
    div.querySelector('.try').onclick = () => { if (L.steps[state.cur].type === 'gap') return; setCode(code + '\n'); runCode(); };
  });
  drawCharts();
  hookVideo(s, S);
  document.querySelectorAll('.vlink').forEach(a => a.addEventListener('click', () => Sess.externalOpened(a.dataset.title, +a.dataset.cap || 30, state.cur, a.dataset.url || '')));
  document.querySelectorAll('.mwatch').forEach(cb => cb.addEventListener('change', () => Sess.manualTick(cb.dataset.url, cb.dataset.title, cb.checked)));

  if (s.type === 'mc') {
    const box = $('opts');
    const showAfter = () => { if (s.after) { const p = document.createElement('p'); p.style.marginTop = '10px'; p.innerHTML = s.after; $('fb').appendChild(p); } };
    const pick = (k, silent) => {
      const o = s.options[k]; const b = box.querySelector('[data-k="' + k + '"]');
      b.classList.add(o.ok ? 'sel-ok' : 'sel-bad'); b.disabled = true;
      if (!S.picked.includes(k)) S.picked.push(k);
      if (o.ok) { if (!S.done && !silent) Sess.stepDone(state.cur); S.done = true; box.querySelectorAll('.opt').forEach(x => x.disabled = true); }
      feedback(o.ok ? 'ok' : 'bad', '<b class="h">' + (o.ok ? 'Richtig' : 'Nicht ganz') + '</b>' + o.fb + (o.ok ? '' : '<br><span style="color:var(--muted)">Versuch es noch einmal.</span>'));
      if (o.ok) showAfter();
      if (!silent) { save(); renderParts(); updateNav(); }
    };
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.getAttribute('data-k')));
    S.picked.forEach(k => pick(k, true));
  }
  if (s.type === 'rf') {
    document.querySelectorAll('.rfrow').forEach(row => {
      const k = +row.dataset.rf;
      row.querySelectorAll('.rfb').forEach(b => b.onclick = () => { S.rf[k] = b.dataset.v === '1'; row.querySelectorAll('.rfb').forEach(x => x.classList.toggle('sel', x === b)); save(); });
    });
    $('rfcheck').onclick = checkRF;
    if (S.done && S.rf.length === s.statements.length) checkRF();
  }
  if (s.type === 'calc') {
    $('calccheck').onclick = checkCalc;
    $('hintbtn').onclick = () => $('hint').classList.add('show');
    document.querySelectorAll('[data-f]').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkCalc(); }));
    if (S.done) checkCalc();
  }
  if (s.type === 'code' || s.type === 'num' || s.type === 'gap') {
    $('hintbtn').onclick = () => { $('hint').classList.add('show'); if (s.hint2) $('hint2btn').style.display = ''; if ($('solbtn')) $('solbtn').style.display = ''; };
    if (s.hint2) $('hint2btn').onclick = () => $('hint2').classList.add('show');
    if ($('solbtn')) {
      $('solbtn').onclick = () => {
        if (s.type === 'gap') { const vals = gapParts(s.gap).filter(p => p.t === 'gap').map(p => p.v); st(state.cur).gaps = vals; save(); renderGap(s); }
        else setCode((s.starter && /^#/.test(s.starter) ? s.starter : '') + s.solution + '\n');
        feedback('warn', '<b class="h">Lösung eingesetzt</b>Führ sie aus und lies die Ausgabe. Danach einmal selbst schreiben, ohne nachzusehen.');
      };
      if (S.tries >= 2) $('solbtn').style.display = '';
    }
  }
  if (s.type === 'num') {
    $('numcheck').onclick = checkNum;
    $('numin').addEventListener('keydown', e => { if (e.key === 'Enter') checkNum(); });
    if (S.done) { $('numin').value = fmtDe(firstNum(evalValue(s.answerExpr)), s.decimals || 0); feedback('ok', '<b class="h">Bereits gelöst</b>' + (s.explain || '')); }
  }
  if ((s.type === 'code' || s.type === 'gap') && S.done) feedback('ok', '<b class="h">Bereits gelöst</b>' + (s.success || ''));

  // rechte Seite
  const mainEl = document.querySelector('main'), wasSolo = mainEl.classList.contains('solo'), solo = !needsR(s);
  mainEl.classList.toggle('solo', solo);
  if (wasSolo && !solo) { const rp = document.querySelector('.right'); rp.classList.remove('appear'); void rp.offsetWidth; rp.classList.add('appear'); }
  const isGap = s.type === 'gap';
  document.querySelector('.edwrap').classList.toggle('gapmode', isGap);
  $('check').style.display = (s.type === 'code' || isGap) ? '' : 'none';
  if (isGap) renderGap(s);
  else setCode(S.code !== null && S.code !== undefined ? S.code : (s.starter || ''));
  $('edlabel').textContent = isGap ? 'skript.R · Lückencode: direkt in die Felder tippen' : 'skript.R';
  save(); renderParts(); updateNav();
}
$('check').onclick = checkCode;
$('prev').onclick = () => go(state.cur - 1);
$('next').onclick = () => go(state.cur + 1);

conAppend('note', 'R-Übungskonsole. Geladen: studie (Datensatz) und leiden (Urliste Leidensdruck).');
Sess.init();
render();
};
</script>

    const obj = JSON.parse(new TextDecoder().decode(plain));
    window.LESSON = obj.lesson; window.STUDIE = obj.studie;
    document.getElementById('lock').remove();
    document.title = obj.lesson.kurs + ': ' + obj.lesson.title;
    window.startApp();
  }
  let saved = null; try { saved = localStorage.getItem('lernkurs:pw'); } catch (e) {}
  if (saved) tryOpen(saved).catch(() => { try { localStorage.removeItem('lernkurs:pw'); } catch (e) {} });
  document.getElementById('lockform').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = document.getElementById('lockpw').value;
    try { await tryOpen(pw); try { localStorage.setItem('lernkurs:pw', pw); } catch (e2) {} }
    catch (err) { document.getElementById('lockerr').textContent = 'Das Passwort stimmt nicht.'; }
  });
})();
</script>
</body>
