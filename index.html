<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studium">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131415" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Studium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap">
<style>
/* Zwei Ansichten: "Als Nächstes" (was jetzt zu tun ist) und "Zeitplan" (was laut Uni wann dran ist).
   Rückstand zählt nur Minimum-Aufgaben, deren offizieller Bearbeitungszeitraum vorbei ist. */
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1d1f; --muted:#5f6369; --faint:#6e7278; --line:#e4e2dd; --soft:#f0eee9; --track:#ebe8e2;
  --box:#868a90; --late:#b5400b; --lateb:#c4561c; --late-soft:#fbe9dd; --ok:#1f7a55; --dis:#c9c6c0;
  --btn:#1c1d1f; --btn-ink:#ffffff; --scrim:rgba(28,29,31,.35); --dot-live:#5cc49a;
  --shadow:0 1px 2px rgba(28,29,31,.08),0 2px 6px rgba(28,29,31,.06);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131415; --card:#1d1f21; --ink:#eceeef; --muted:#9ca1a6; --faint:#878d92; --line:#2c3033; --soft:#26292b; --track:#26292b;
  --box:#767c81; --late:#f0915f; --lateb:#e0814f; --late-soft:#3a2418; --ok:#5cc49a; --dis:#454a4e;
  --btn:#eceeef; --btn-ink:#131415; --scrim:rgba(0,0,0,.55); --shadow:none; --dot-live:#1f7a55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131415; --card:#1d1f21; --ink:#eceeef; --muted:#9ca1a6; --faint:#878d92; --line:#2c3033; --soft:#26292b; --track:#26292b;
  --box:#767c81; --late:#f0915f; --lateb:#e0814f; --late-soft:#3a2418; --ok:#5cc49a; --dis:#454a4e;
  --btn:#eceeef; --btn-ink:#131415; --scrim:rgba(0,0,0,.55); --shadow:none; --dot-live:#1f7a55; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
.shell{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 40px) 24px 24px}
.main.zp{padding-left:0;padding-right:0}
nav{flex:none;border-top:1px solid var(--line);background:var(--card);padding:10px 24px calc(env(safe-area-inset-bottom,0px) + 12px)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--track)}
.seg a{text-align:center;padding:9px 0;border-radius:10px;font-size:15px;font-weight:600;color:var(--muted);text-decoration:none}
.seg a[aria-current="page"]{font-weight:700;color:var(--ink);background:var(--card);box-shadow:var(--shadow)}

/* Als Nächstes */
.date{margin:0;font-size:14px;color:var(--muted)}
h1.head{margin:24px 0 0;font-size:36px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
.sum{margin:12px 0 0;font-size:17px;line-height:1.45}
.now{flex:none;margin-top:40px;background:var(--card);border-radius:22px;padding:22px;border:1px solid var(--line)}
.lbl{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.now .where{margin:14px 0 0;font-size:14px;color:var(--muted)}
.now .t{margin:4px 0 0;font-size:26px;line-height:1.2;font-weight:800;text-wrap:balance}
.now .why{margin:8px 0 0;font-size:16px;line-height:1.4}
.done{margin-top:20px;width:100%;padding:15px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-size:16px;font-weight:700;text-align:center}
.toggle{flex:none;margin-top:12px;align-self:center;padding:12px 18px;font-size:15px;font-weight:700}
.list{flex:none;margin-top:2px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0}
.row+.row{border-top:1px solid var(--soft)}
.ck{flex:none;width:44px;height:44px;margin:-10px -10px -10px -11px;display:flex;align-items:center;justify-content:center}
.ck span{width:22px;height:22px;border-radius:7px;border:2px solid var(--box);display:flex;align-items:center;justify-content:center}
.ck svg{width:14px;height:14px;opacity:0;color:var(--btn-ink)}
.ck.late span{border-color:var(--lateb)} .ck.unk span{border:2px dashed var(--lateb)}
.ck.on span{border:0;background:var(--btn)} .ck.on svg{opacity:1}
.tx{flex:1;min-width:0}
.tx .t{display:block;font-size:15px}
.tx .s{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.row.d .tx .t{color:var(--faint);text-decoration:line-through}
.tag{flex:none;font-size:12px;font-weight:700;color:var(--muted)}
.tag.late{color:var(--late)}
.empty{margin-top:40px;color:var(--muted);font-size:16px;line-height:1.45}
.empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:6px}

/* Zeitplan */
.zhead{margin:0 24px;display:flex;align-items:center;justify-content:space-between;min-height:40px}
.zhead h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.pill{border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;background:var(--track)}
.wsw{margin:14px 12px 0;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center}
.chev{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.chev:disabled{color:var(--dis);cursor:default}
.chev svg{width:22px;height:22px}
.wpick{text-align:center;padding:4px 0}
.wpick small{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.wpick b{display:inline-flex;align-items:center;gap:6px;font-size:19px;font-weight:800}
.wpick b svg{width:16px;height:16px}
.od{margin:10px 24px 0;align-self:center;background:var(--late-soft);color:var(--late);font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px}
.state{margin:18px 24px 0;display:flex;align-items:baseline;justify-content:space-between}
.state span{font-size:13px;font-weight:600;color:var(--muted)} .state span.late{color:var(--late)}
.state em{font-style:normal;font-size:15px;color:var(--muted);white-space:nowrap} .state em b{font-size:22px;color:var(--ink)}
.bar{margin:10px 24px 0;height:4px;border-radius:2px;background:var(--line)} .bar i{display:block;height:4px;border-radius:2px;background:var(--ink)}
.groups{margin:20px 16px 0;display:flex;flex-direction:column;gap:12px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px 4px}
.grp h2{margin:0 0 4px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp h2 span{font-size:13px;font-weight:600;color:var(--faint)} .grp h2 span.late{color:var(--late)}
.grp .row{padding:10px 0;border-top:1px solid var(--soft)}
.chip{flex:none;font-size:12px;font-weight:600;color:var(--muted);background:var(--track);padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.late{color:var(--late);background:var(--late-soft);font-weight:700}
.chip.z{background:transparent;border:1px solid var(--line)}
.dot{flex:none;width:44px;height:44px;margin:-10px -10px -10px -11px;display:flex;align-items:center;justify-content:center}
.dot span{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.row.z .tx .t{color:var(--muted)}
.free{margin:20px 24px 0;color:var(--muted);font-size:16px}
.sheet{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.sheet>button{flex:1}
.sheet .p{background:var(--card);border-radius:24px 24px 0 0;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 24px);max-height:78%;display:flex;flex-direction:column}
.sheet .h{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 8px}
.sheet .h h2{margin:0;font-size:18px;font-weight:800}
.sheet .h button{font-size:15px;font-weight:700;color:var(--muted);padding:8px 0}
.sheet .l{overflow-y:auto;padding:0 24px}
.wr{width:100%;display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--soft)}
.wr .a{flex:1} .wr .a b{display:block;font-size:15px;font-weight:600} .wr .a b.on{font-weight:800}
.wr .a small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.wr>span{font-size:13px;font-weight:700;color:var(--muted)} .wr>span.late{color:var(--late)}
.keyf{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.keyf p{margin:10px 0 14px;font-size:15px;color:var(--muted);line-height:1.4}
.keyf input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.main{overscroll-behavior-y:contain}
.stat{flex:none;margin-top:18px;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--track);color:var(--ink);text-decoration:none}
.stat .g{flex:1;display:flex;gap:18px}.stat small{display:block;font-size:12px;font-weight:700;color:var(--muted)}.stat b{font-size:18px;font-weight:800}.stat i{font-style:normal;font-size:13px;font-weight:600;color:var(--muted)}
.stat svg{width:18px;height:18px;color:var(--muted);flex:none}
.now .lbl{display:flex;justify-content:space-between;align-items:center}
.pillc{font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;padding:4px 10px;border-radius:999px;background:var(--track);color:var(--muted)}
.pillc.live{background:var(--ok);color:var(--card)}
.clock{margin:16px 0 0;font-size:56px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.row2 .done{margin-top:0}
.done{display:flex;align-items:center;justify-content:center;gap:8px}.done svg{width:18px;height:18px}
.done.sec{background:var(--track);color:var(--ink)}
.plain{display:block;width:100%;margin-top:12px;padding:6px;text-align:center;font-size:14px;font-weight:700;color:var(--muted)}
#mini{flex:none}
.mini{display:flex;align-items:center;gap:12px;margin:0 16px 10px;padding:10px 12px 10px 14px;border-radius:16px;background:var(--btn);color:var(--btn-ink)}
.mini .dt{width:8px;height:8px;border-radius:50%;background:var(--dot-live);flex:none}.mini .x{flex:1;min-width:0}.mini .x b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini .x small{font-size:12px;opacity:.7}
.mini .c{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.mini button{padding:7px 12px;border-radius:10px;background:rgba(127,127,127,.3);font-size:13px;font-weight:700;color:inherit}
.p.ask{padding:10px 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.at{margin:4px 0 0;font-size:22px;font-weight:800;line-height:1.2}.aq{margin:6px 0 0;font-size:16px}
.chips4,.chips3{margin-top:16px;display:grid;gap:8px}.chips4{grid-template-columns:repeat(4,1fr)}.chips3{grid-template-columns:repeat(3,1fr)}
.chips4 button,.chips3 button{padding:13px 0;border-radius:12px;background:var(--track);text-align:center;font-size:15px;font-weight:700}
.oth{margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:10px}.oth input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.oth .done{margin-top:0;width:auto;padding:12px 18px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;margin:-14px 0 0 -6px;padding:6px;font-size:15px;font-weight:700;color:var(--muted);text-decoration:none}.back svg{width:18px;height:18px}
h1.vh{margin:10px 0 0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.tiles{flex:none;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}.tile small{font-size:12px;font-weight:700;color:var(--muted)}.tile b{display:block;margin-top:4px;font-size:26px;font-weight:800}.tile p{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
.bar0{margin-top:10px;height:4px;border-radius:2px;background:var(--line)}.bar0 i{display:block;height:4px;border-radius:2px;background:var(--ink)}
.chart,.dayl{flex:none;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px 12px}
.dayl{padding:14px 16px 4px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.ch h2{margin:0;font-size:16px;font-weight:800}.ch b{font-size:15px}
.leg{display:flex;gap:10px;font-size:11px;font-weight:600;color:var(--muted)}.leg span{display:inline-flex;align-items:center;gap:4px}.leg i{width:12px;display:inline-block}
.leg .da,.ln.da{border-top:2px dashed var(--ink)}.leg .go,.ln.go{border-top:2px solid var(--ok)}
.plot{position:relative;height:150px;margin-top:14px}.ln{position:absolute;left:0;right:0;opacity:.6}
.bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;align-items:end}
.bars button{height:100%;display:flex;align-items:flex-end}.bars span{width:100%;border-radius:6px}
.lbls{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;margin-top:6px}.lbls span{text-align:center;font-size:10px}
.dday{border-top:1px solid var(--soft)}
.dh{width:100%;display:flex;align-items:center;gap:10px;padding:12px 0;font-size:15px}.dh span{flex:1;text-align:left}.dh b{font-size:15px}.dh b.z{color:var(--faint);font-weight:600}
.dh svg{width:16px;height:16px;color:var(--muted);transition:transform .2s}.dh i{width:16px}.dday.on .dh svg{transform:rotate(180deg)}.dh:disabled{cursor:default}
.drow{display:flex;align-items:center;gap:12px;padding:8px 0 8px 12px;border-left:2px solid var(--line);margin:0 0 6px 2px}.none{margin:0;padding:12px 0 14px;color:var(--muted);font-size:15px}
.ptr{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);width:36px;height:36px;margin-left:-18px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
  transform:translateY(-60px);opacity:0;z-index:4;pointer-events:none}
.ptr svg{width:18px;height:18px;color:var(--ink)}
.ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,16px);opacity:0;background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:all .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Datenstand neben dem Datum */
.dl{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stand{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.stand svg{width:14px;height:14px}
.stand.off{color:var(--late);background:var(--late-soft);padding:4px 10px;border-radius:999px}
/* Rückstand antippbar */
.sl{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.odl .row{padding:11px 0}.odl .row+.row{border-top:1px solid var(--soft)}
/* Am Schreibtisch: Als Nächstes und Zeitplan nebeneinander */
@media (min-width:1000px){
  .shell{max-width:1184px}
  nav{display:none}
  .main.wide{padding:48px 32px}
  .cols{display:flex;gap:56px;align-items:flex-start}
  .colL{flex:1 1 360px;max-width:420px;display:flex;flex-direction:column}
  .colR{flex:999 1 560px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .colR>*{grid-column:1/-1}
  .colR .zhead{grid-column:1;grid-row:1;margin:0}
  .colR .wsw{grid-column:2;grid-row:1;margin:0;grid-template-columns:44px auto 44px}
  .colR .wpick{padding:4px 8px}
  .colR .od{justify-self:start;margin:14px 0 0}
  .colR .state,.colR .bar,.colR .free{margin-left:0;margin-right:0}
  .colR .groups{margin:20px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
</style>
</head>
<body>
<div class="shell">
  <div class="main" id="main"></div>
  <div id="mini"></div>
  <nav aria-label="Hauptnavigation"><div class="seg">
    <a href="#" id="n1">Als Nächstes</a><a href="#zeitplan" id="n2">Zeitplan</a>
  </div></nav>
  <div id="ov"></div>
  <div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* Datenquelle: Google-Tabelle "Studien-Hub Wochenplan" über das Skript "Studien-Hub Schnittstelle".
   Blätter: wochenplan (Arbeitsschritte), zeitplan (Uni-Bausteine mit offiziellem Zeitraum).
   Der Schlüssel kommt nur über den persönlichen Link (?k=...) und bleibt im Gerät. */
const API="https://script.google.com/macros/s/AKfycby527965MYC7xpuzDuMsJ867wvj5lUO3fpVItky-bHpHem6PknQ8ef4VaiV6KrKQ87t/exec";
const KURS={Psy:"Psychologie",Stat:"Statistik",FoM:"Forschungsmethoden",KuV:"Kulturelle Vielfalt",WisA:"Wiss. Arbeiten",Orga:"Organisation"};
const FIRST="2026-10-12", WEEKS=20;
/* Neue Version erkennen: version.json wird bei jeder Veröffentlichung hochgezählt, dann lädt die App sich selbst neu */
const APP_V="10";
async function checkVersion(){try{const j=await fetch("version.json?x="+Date.now(),{cache:"no-store"}).then(r=>r.json());if(j&&j.v&&String(j.v)!==APP_V){location.reload();return true;}}catch(_){}return false;}
const PAUSE={"2026-12-21":"Betreuungspause. Laut Zeitplan keine neuen Aufgaben.","2027-02-08":"Selbständige Wiederholung.","2027-02-15":"Selbständige Wiederholung. Klausuranmeldung bis 15.02."};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st={rows:[],zp:[],zeit:[],queue:[],key:"",net:"",open:false,wi:null,sheet:false,odOpen:false,ask:null,other:false,sel:null,days:{},allDays:false,syncedAt:0};
(function(){
  let k="";try{k=new URLSearchParams(location.search).get("k")||"";}catch(e){}
  try{if(k)localStorage.setItem("hub-key",k);else k=localStorage.getItem("hub-key")||"";}catch(e){}
  st.key=k;
  try{const c=JSON.parse(localStorage.getItem("hub3-cache")||"null");if(c){st.rows=c.rows||[];st.zp=c.zp||[];st.zeit=c.zeit||[];st.queue=c.queue||[];st.syncedAt=c.syncedAt||0;}}catch(e){}
})();
function save(){try{localStorage.setItem("hub3-cache",JSON.stringify({rows:st.rows,zp:st.zp,zeit:st.zeit,queue:st.queue,syncedAt:st.syncedAt}));}catch(e){}}
let chain=Promise.resolve();
function sync(){
  chain=chain.then(async()=>{
    if(!st.key){st.net="key";render();return false;}
    const ops=st.queue.slice();
    try{
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({k:st.key,ops,data:false})});
      const j=await r.json();if(!j.ok)throw new Error(j.error||"api");
      st.queue=st.queue.slice(ops.length);
      st.rows=j.plan||[];if(j.zeitplan)st.zp=j.zeitplan;if(j.zeit)st.zeit=j.zeit;st.net="ok";st.syncedAt=Date.now();save();render();return true;
    }catch(e){const was=st.net;st.net=e&&e.message==="key"?"key":"off";if(st.net!==was)render();return false;}
  });
  return chain;
}

/* ---------- Zeit ---------- */
const iso=d=>{const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
const day=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||""));return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const d10=s=>String(s||"").slice(0,10);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const TODAY=()=>iso(new Date());
const dm=s=>{const d=day(s);return d?`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.`:"";};
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONL=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const WDL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

/* ---------- Status ---------- */
const isDone=r=>/^erledigt$/i.test(String(r.status||"").trim());
const isZ=r=>/zusatz/i.test(r.prioritaet||"");
const isMin=z=>/^ja$/i.test(String(z.minimum||"").trim());
const isTermin=z=>/^termin$/i.test(String(z.art||"").trim());
const zpById=id=>st.zp.find(z=>String(z.id)===String(id));
function zpDone(z){return isDone(z)||st.rows.some(r=>String(r.baustein)===String(z.id)&&isDone(r));}
const isUnk=z=>/^unklar$/i.test(String(z.status||"").trim())&&!zpDone(z);
const zpLate=z=>isMin(z)&&!isTermin(z)&&!zpDone(z)&&d10(z.ende)&&d10(z.ende)<TODAY();
function overdue(){return st.zp.filter(zpLate);}

/* ---------- Zeiterfassung ---------- */
const GOAL=18;
const num=x=>{const n=+x;return isFinite(n)?n:0;};
const segMs=z=>num(z.minuten)?num(z.minuten)*60000:(num(z.start)?(num(z.ende)||Date.now())-num(z.start):0);
const segDay=z=>iso(new Date(num(z.start)||num(z.ende)));
const running=()=>st.zeit.find(z=>num(z.start)&&!num(z.ende)&&!num(z.minuten));
function refsOf(x){ // Wochenplan-Zeile oder Zeitplan-Baustein
  const out=new Set();
  if(x._zpItem){out.add("zp:"+x.id);st.rows.filter(r=>String(r.baustein)===String(x.id)).forEach(r=>out.add(String(r.id)));}
  else{out.add(String(x.id));if(x.baustein){out.add("zp:"+x.baustein);st.rows.filter(r=>String(r.baustein)===String(x.baustein)).forEach(r=>out.add(String(r.id)));}}
  return out;}
const segsFor=x=>{const r=refsOf(x);return st.zeit.filter(z=>r.has(String(z.ref)));};
function fmtH(ms){const m=Math.round(ms/60000);if(m<60)return m+" Min";const h=Math.round(m/6)/10;return String(h).replace(".",",")+" h";}
function fmtClock(ms){const m=Math.floor(ms/60000);return Math.floor(m/60)+":"+String(m%60).padStart(2,"0");}
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
function dayMs(key){return st.zeit.filter(z=>segDay(z)===key).reduce((a,z)=>a+segMs(z),0);}
function stats(){const t=new Date();const mo=monday(t);let wk=0;for(let d=new Date(mo);iso(d)<=iso(t);d=addD(d,1))wk+=dayMs(iso(d));
  let s7=0;for(let k=0;k<7;k++)s7+=dayMs(iso(addD(t,-k)));return {wk,avg:s7/7};}
function pushSeg(z){st.queue.push({t:"zeit",row:Object.assign({},z)});}
function stopRunning(){const r=running();if(r){r.ende=Date.now();pushSeg(r);}return r;}
function startFor(x){stopRunning();const z={id:"t"+Date.now(),ref:String(x._zpItem?"zp:"+x.id:x.id),titel:x.schritt||x.titel||"",kurs:x.kurs||"",start:Date.now(),ende:"",minuten:"",quelle:"uhr"};st.zeit.push(z);pushSeg(z);}
function addManual(x,min){const z={id:"m"+Date.now(),ref:String(x.ref),titel:x.titel,kurs:x.kurs,start:"",ende:Date.now(),minuten:min,quelle:"nachtrag"};st.zeit.push(z);pushSeg(z);}
const fmtH1=h=>String(Math.round(h*10)/10).replace(".",",");

/* ---------- Als Nächstes ---------- */
function queueList(){
  const wk=iso(monday(new Date()));
  // Abrufrunde höchstens einmal pro Tag und erst ab ihrem Fälligkeitstag
  const isAbruf=r=>/^abruf/i.test(String(r.art||""));
  const abrufToday=st.rows.some(r=>isAbruf(r)&&isDone(r)&&d10(r.erledigt_am)===TODAY());
  const rows=st.rows.filter(r=>!isDone(r)&&d10(r.woche)<=wk&&!(isAbruf(r)&&(abrufToday||(r.faellig&&d10(r.faellig)>TODAY()))));
  const linked=new Set(st.rows.filter(r=>!isDone(r)).map(r=>String(r.baustein||"")));
  // Was laut Uni überfällig ist, aber noch nicht im Wochenplan steht, kommt trotzdem auf die Liste
  const extra=overdue().filter(z=>!linked.has(String(z.id))).map(z=>({id:"zp:"+z.id,schritt:z.titel,kurs:z.kurs,baustein:z.id,notiz:z.hinweis||"",rang:50,prioritaet:"Pflicht",status:"offen",_zp:true}));
  const rk=r=>r.rang===""||r.rang==null?99:+r.rang;
  return rows.concat(extra).sort((a,b)=>(isZ(a)-isZ(b))||(rk(a)-rk(b))||d10(a.faellig).localeCompare(d10(b.faellig)));
}
function whereOf(r){const z=r.baustein?zpById(r.baustein):null;
  if(z){const g=String(z.gruppe||"");const range=` · ${dm(z.start)}–${dm(z.ende)}`;return g+(isTermin(z)?"":range);}
  return KURS[r.kurs]||r.kurs||"";}
function tagOf(r){
  if(isZ(r))return {t:"Zusatz",c:""};
  const z=r.baustein?zpById(r.baustein):null;
  if(z&&isUnk(z))return {t:"prüfen",c:"late",box:"unk"};
  if(z&&zpLate(z))return {t:"seit "+dm(z.ende),c:"late",box:"late"};
  if(z&&z.frist)return {t:"bis "+dm(z.frist),c:""};
  return {t:"diese Woche",c:""};
}
const REFRESH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>';
const NONET='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.3-1.6"/><path d="M12 20h.01"/></svg>';
function vStand(){ // wann die Daten zuletzt aus der Tabelle kamen
  if(!st.syncedAt)return st.net==="off"?`<span class="stand off">${NONET}Offline</span>`:"";
  const t=st.syncedAt;const when=(iso(new Date(t))===TODAY()?"":dm(iso(new Date(t)))+" ")+hm(t);
  return st.net==="off"?`<span class="stand off">${NONET}Offline · Stand ${when}</span>`:`<span class="stand">${REFRESH}Stand ${when}</span>`;
}
function vOd(){ // Liste der überfälligen Aufgaben, über "x Aufgaben aus früheren Wochen" erreichbar
  if(!st.odOpen)return "";
  const od=overdue().slice().sort((a,b)=>d10(a.ende).localeCompare(d10(b.ende)));
  const wk=z=>{const a=day(z.woche),f=day(FIRST);return a&&f?"Woche "+(Math.round((a-f)/(7*864e5))+1):"";};
  const rows=od.map(z=>{const sub=[KURS[z.kurs]||z.kurs||"",wk(z),isTermin(z)?"":`${dm(z.start)}–${dm(z.ende)}`].filter(Boolean).join(" · ");
    return `<div class="row"><button class="ck ${isUnk(z)?"unk":"late"}" data-tog="zp:${esc(z.id)}" aria-label="${esc(z.titel)} abhaken"><span>${CHECK}</span></button><span class="tx"><span class="t">${esc(z.titel)}</span><span class="s">${esc(sub)}</span></span><span class="tag late">seit ${esc(dm(z.ende))}</span></div>`;}).join("");
  return `<div class="sheet"><button data-odclose aria-label="Schließen"></button><div class="p" role="dialog" aria-label="Aus früheren Wochen offen">
  <div class="h"><h2>Aus früheren Wochen offen</h2><button data-odclose>Fertig</button></div><div class="l odl">${rows||`<p class="none">Alles erledigt.</p>`}</div></div></div>`;
}
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function vNext(){
  const now=new Date();
  const date=`${WDL[now.getDay()]}, ${now.getDate()}. ${MONL[now.getMonth()]}`;
  if(!st.key||st.net==="key")return `<p class="date">${date}</p><form class="keyf" id="keyf"><p class="lbl">Zugang</p><p>Einmal den Schlüssel aus deinem persönlichen Link einfügen (alles nach „k=“).</p><input id="keyin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Schlüssel"><button class="done">Verbinden</button></form>`;
  if(!st.rows.length&&!st.zp.length)return st.net==="off"
    ?`<p class="date">${date}</p><div class="empty" role="status"><b>Keine Verbindung</b>Dein Stand kommt aus deiner Tabelle. Sobald du online bist, lädt er von selbst.</div><button class="done sec" data-retry>${REFRESH}Erneut versuchen</button>`
    :`<p class="date">${date}</p><div class="empty"><b>Lädt …</b>Der Stand kommt aus deiner Tabelle.</div>`;
  const od=overdue();const n=od.length;
  const by={};od.forEach(z=>by[z.kurs]=(by[z.kurs]||0)+1);
  const mx=Math.max(0,...Object.values(by));const top=Object.keys(by).filter(k=>by[k]===mx).map(k=>KURS[k]||k);
  const most=n>1&&top.length<=2?` Am meisten bei ${top.join(" und ")}.`:"";
  const head=n?"Du hängst hinterher.":"Du bist im Plan.";
  const sum=n?`<button class="sl" data-od aria-haspopup="dialog">${n} ${n===1?"Aufgabe":"Aufgaben"} aus früheren Wochen</button> ${n===1?"ist":"sind"} noch offen.${esc(most)}`:"Alles aus früheren Wochen ist erledigt.";
  const q=queueList();const cur=q[0];const rest=q.slice(1);
  const card=cur?vCard(cur):`<div class="empty"><b>Nichts mehr offen</b>Für diese Woche ist alles erledigt.</div>`;
  const S=stats();
  const statRow=`<a class="stat" href="#verlauf"><span class="g"><span><small>Diese Woche</small><b>${fmtH1(S.wk/36e5)} h</b> <i>von ${GOAL} h</i></span><span><small>Ø pro Tag</small><b>${fmtH1(S.avg/36e5)} h</b> <i>Ziel ${fmtH1(GOAL/7)} h</i></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></a>`;
  const toggle=rest.length?`<button class="toggle" data-open aria-expanded="${st.open}">${st.open?"Weniger anzeigen":`Ganze Liste (${rest.length})`}</button>`:"";
  const list=st.open&&rest.length?`<div class="list">${rest.map(r=>{const t=tagOf(r);
    return `<div class="row"><button class="ck ${t.box||""}" data-tog="${esc(r.id)}" aria-label="${esc(r.schritt)} abhaken"><span>${CHECK}</span></button><span class="tx"><span class="t">${esc(r.schritt)}</span><span class="s">${esc(whereOf(r))}</span></span><span class="tag ${t.c}">${esc(t.t)}</span></div>`;}).join("")}</div>`:"";
  return `<div class="dl"><p class="date">${date}</p>${vStand()}</div><h1 class="head" style="color:var(${n?"--late":"--ok"})">${head}</h1><p class="sum">${sum}</p>${statRow}${card}${toggle}${list}`;
}

const PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
function vCard(cur){
  const run=running();const segs=segsFor(cur);const mine=run&&refsOf(cur).has(String(run.ref));
  const head=`<p class="where">${esc(whereOf(cur))}</p><p class="t">${esc(cur.schritt)}</p>`;
  if(mine)return `<section class="now"><p class="lbl">Läuft <span class="pillc live">seit ${hm(num(run.start))}</span></p>${head}<p class="clock" data-clock="${num(run.start)}">${fmtClock(Date.now()-num(run.start))}</p>
    <div class="row2"><button class="done sec" data-pause>Pause</button><button class="done" data-fertig="${esc(cur.id)}">Fertig</button></div></section>`;
  if(segs.length){const tot=segs.reduce((a,z)=>a+segMs(z),0);
    return `<section class="now"><p class="lbl">Pausiert <span class="pillc">bisher ${fmtClock(tot)}</span></p>${head}${cur.notiz?`<p class="why">${esc(cur.notiz)}</p>`:""}
    <div class="row2"><button class="done" data-start="${esc(cur.id)}">${PLAY}Weiter</button><button class="done sec" data-fertig="${esc(cur.id)}">Fertig</button></div></section>`;}
  return `<section class="now"><p class="lbl">Als Nächstes</p>${head}${cur.notiz?`<p class="why">${esc(cur.notiz)}</p>`:""}<button class="done" data-start="${esc(cur.id)}">${PLAY}Starten</button><button class="plain" data-tog="${esc(cur.id)}">Ohne Uhr abhaken</button></section>`;
}

/* ---------- Verlauf ---------- */
function vVerlauf(){
  const S=stats();const t=new Date();const days=[];
  for(let k=13;k>=0;k--){const d=addD(t,-k);days.push({d,key:iso(d),ms:dayMs(iso(d)),today:k===0});}
  if(st.sel==null)st.sel=13;const sel=days[st.sel];
  const MAXH=Math.max(4,...days.map(x=>x.ms/36e5));const H=150;const y=h=>Math.round(h/MAXH*H);
  const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
  const bars=days.map((x,k)=>`<button data-day="${k}" aria-label="${x.d.getDate()}.${x.d.getMonth()+1}., ${fmtH(x.ms)}"><span style="height:${Math.max(4,y(x.ms/36e5))}px;background:var(${k===st.sel?"--ink":x.ms?"--box":"--track"})"></span></button>`).join("");
  const labels=days.map((x,k)=>`<span style="font-weight:${k===st.sel?800:600};color:var(${k===st.sel?"--ink":"--faint"})">${x.today?"heute":WD[x.d.getDay()]}</span>`).join("");
  // Alle Tage seit dem ersten Eintrag, neueste zuerst; jeder Tag aufklappbar
  const first=st.zeit.map(segDay).filter(Boolean).sort()[0]||iso(t);
  const all=[];for(let d=new Date(t);iso(d)>=first;d=addD(d,-1))all.push(iso(d));
  const shown=st.allDays?all:all.slice(0,10);
  const dayRow=key=>{const d=day(key);const ms=dayMs(key);const open=!!st.days[key];
    const segs=st.zeit.filter(z=>segDay(z)===key);const by={};
    segs.forEach(z=>{const k=String(z.ref);(by[k]=by[k]||{titel:z.titel,kurs:z.kurs,ms:0}).ms+=segMs(z);});
    const title=(key===iso(t)?"Heute, ":WDL[d.getDay()]+", ")+d.getDate()+". "+MON[d.getMonth()];
    const items=open&&ms?Object.values(by).map(x=>`<div class="drow"><span class="tx"><span class="t">${esc(x.titel)}</span><span class="s">${esc(KURS[x.kurs]||x.kurs||"")}</span></span><span class="tag" style="color:var(--ink)">${fmtH(x.ms)}</span></div>`).join(""):"";
    return `<div class="dday ${open?"on":""}" id="d-${key}"><button class="dh" ${ms?`data-dayt="${key}"`:"disabled"}><span>${esc(title)}</span><b class="${ms?"":"z"}">${ms?fmtH(ms):"–"}</b>${ms?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`:"<i></i>"}</button>${items}</div>`;};
  const more=all.length>10?`<button class="plain" data-alldays>${st.allDays?"Weniger anzeigen":`Ältere Tage (${all.length-10})`}</button>`:"";
  return `<a class="back" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Als Nächstes</a>
  <h1 class="vh">Verlauf</h1>
  <div class="tiles"><div class="tile"><small>Diese Woche</small><b>${fmtH1(S.wk/36e5)} h</b><div class="bar0"><i style="width:${Math.min(100,S.wk/36e5/GOAL*100)}%"></i></div><p>von ${GOAL} h Ziel</p></div>
  <div class="tile"><small>Ø pro Tag</small><b>${fmtH1(S.avg/36e5)} h</b><p>letzte 7 Tage, freie Tage zählen mit</p></div></div>
  <section class="chart"><div class="ch"><p class="lbl">Letzte 14 Tage</p><span class="leg"><span><i class="da"></i>Ø</span><span><i class="go"></i>Ziel</span></span></div>
  <div class="plot"><div class="ln da" style="bottom:${y(S.avg/36e5)}px"></div><div class="ln go" style="bottom:${y(GOAL/7)}px"></div><div class="bars">${bars}</div></div><div class="lbls">${labels}</div></section>
  <section class="dayl"><p class="lbl" style="padding:2px 0 6px">Alle Tage</p>${shown.map(dayRow).join("")}${more}</section><div style="height:12px;flex:none"></div>`;
}

/* ---------- Abfragen ---------- */
function vAsk(){
  const run=running();
  if(st.ask){const a=st.ask;
    return `<div class="sheet"><button data-skip aria-label="Schließen"></button><div class="p ask"><p class="lbl" style="margin-top:18px">Erledigt</p><p class="at">${esc(a.titel)}</p><p class="aq">Wie lange hast du daran gesessen?</p>
    ${st.other?`<div class="oth"><input id="othmin" type="number" inputmode="numeric" min="1" placeholder="Minuten"><button class="done" data-othsave>Speichern</button></div>`:
    `<div class="chips4">${[15,30,45,60,90,120,150,180].map(m=>`<button data-min="${m}">${m<60?m+" Min":String(m/60).replace(".",",")+" h"}</button>`).join("")}</div><button class="done sec" data-other style="margin-top:12px">Andere Dauer</button>`}
    <button class="plain" data-skip>Überspringen</button></div></div>`;}
  if(run&&Date.now()-num(run.start)>3*36e5&&!dismissed(run.id)){

    ${st.other?`<div class="oth"><input id="othtime" type="time"><button class="done" data-endsave>Speichern</button></div>`:`<div class="chips3">${opts.map(o=>`<button data-end="${o}">${hm(o)}</button>`).join("")}<button data-other>Andere Zeit</button></div>`}
    <button class="done sec" data-keep style="margin-top:12px">Läuft wirklich noch</button></div></div>`;}

}
function dismissed(id){try{return sessionStorage.getItem("keep-"+id)==="1";}catch(_){return false;}}
function vMini(){const r=running();if(!r||view()==="next")return "";
  return `<div class="mini"><span class="dt"></span><span class="x"><b>${esc(r.titel)}</b><small>läuft seit ${hm(num(r.start))}</small></span><span class="c" data-clock="${num(r.start)}">${fmtClock(Date.now()-num(r.start))}</span><button data-pause>Pause</button></div>`;}

/* ---------- Zeitplan ---------- */
function weeks(){
  const out=[];const f=day(FIRST);const t=TODAY();
  for(let k=0;k<WEEKS;k++){
    const s=addD(f,k*7),e=addD(s,6),key=iso(s);
    const items=st.zp.filter(z=>d10(z.woche)===key);
    const tasks=items.filter(z=>isMin(z)&&!isTermin(z));
    const done=tasks.filter(zpDone).length;
    const past=iso(e)<t,now=key<=t&&t<=iso(e);
    const open=tasks.filter(z=>!zpDone(z)&&d10(z.ende)<t).length;
    out.push({k,key,s,e,items,tasks,done,past,now,open,
      label:"Woche "+(k+1),range:`${s.getDate()}. ${MON[s.getMonth()]} – ${e.getDate()}. ${MON[e.getMonth()]}`});
  }
  return out;
}
function vZeit(){
  const W=weeks();const nowI=Math.max(0,W.findIndex(w=>w.now));
  if(st.wi==null)st.wi=nowI;const i=Math.min(Math.max(st.wi,0),W.length-1);const w=W[i];
  const before=overdue().filter(z=>d10(z.woche)<w.key).length;
  const state=w.now?"Diese Woche":w.past?(w.open?w.open+" noch offen":"Alles erledigt"):"Kommt noch";
  const pct=w.tasks.length?Math.round(w.done/w.tasks.length*100):0;
  const groups={};w.items.forEach(z=>{(groups[z.gruppe]=groups[z.gruppe]||[]).push(z);});
  const order=["Psy","FoM","WisA","KuV","Stat","Orga"];
  const gl=Object.keys(groups).sort((a,b)=>{const ka=order.indexOf(groups[a][0].kurs),kb=order.indexOf(groups[b][0].kurs);return ka-kb||a.localeCompare(b,"de",{numeric:true});});
  const cards=gl.map(g=>{const its=groups[g];const tk=its.filter(z=>isMin(z)&&!isTermin(z));const dn=tk.filter(zpDone).length;
    const lateG=tk.some(zpLate);
    return `<section class="grp"><h2>${esc(g)}${tk.length?`<span class="${lateG?"late":""}">${dn} von ${tk.length}</span>`:""}</h2>${its.map(z=>zRow(z,w)).join("")}</section>`;}).join("");
  const free=!w.items.length?`<p class="free">${esc(PAUSE[w.key]||"Keine Aufgaben laut Zeitplan.")}</p>`:"";
  return `<div class="zhead"><h1>Zeitplan</h1>${i!==nowI?`<button class="pill" data-go="${nowI}">Diese Woche</button>`:""}</div>
  <div class="wsw"><button class="chev" data-go="${i-1}" aria-label="Vorige Woche" ${i===0?"disabled":""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="wpick" data-sheet aria-label="Woche wählen"><small>${w.label}</small><b>${w.range}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></b></button>
  <button class="chev" data-go="${i+1}" aria-label="Nächste Woche" ${i===W.length-1?"disabled":""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
  ${before?`<button class="od" data-sheet>${before} offen aus früheren Wochen</button>`:""}
  ${w.tasks.length?`<div class="state"><span class="${w.past&&w.open?"late":""}">${state}</span><em><b>${w.done}</b> von ${w.tasks.length}</em></div><div class="bar"><i style="width:${pct}%"></i></div>`:""}
  ${free}<div class="groups">${cards}</div><div style="height:16px;flex:none"></div>`;
}
function zRow(z,w){
  const d=zpDone(z);
  if(isTermin(z))return `<div class="row"><span class="dot"><span></span></span><span class="tx"><span class="t">${esc(z.titel)}</span></span><span class="chip">${esc(dm(z.start))}</span></div>`;
  const min=isMin(z);const unk=isUnk(z);const late=zpLate(z);
  const box=d?"on":unk?"unk":late?"late":"";
  let chip="";
  if(!min)chip=`<span class="chip z">${/nicht abgefragt/.test(z.hinweis||"")?"nicht nötig":"Zusatz"}</span>`;
  else if(unk)chip=`<span class="chip late">unklar</span>`;
  else if(z.frist&&!d)chip=`<span class="chip ${late?"late":""}">bis ${esc(dm(z.frist))}</span>`;
  else if(!d&&d10(z.ende)>iso(w.e))chip=`<span class="chip">bis ${esc(dm(z.ende))}</span>`;
  else if(late)chip=`<span class="chip late">seit ${esc(dm(z.ende))}</span>`;
  const sub=z.hinweis&&min&&!/^Zusatz/.test(z.hinweis)?`<span class="s">${esc(z.hinweis)}</span>`:"";
  return `<div class="row ${d?"d":""} ${min?"":"z"}"><button class="ck ${box}" data-zp="${esc(z.id)}" aria-pressed="${d}" aria-label="${esc(z.titel)} abhaken"><span>${CHECK}</span></button><span class="tx"><span class="t">${esc(z.titel)}</span>${sub}</span>${chip}</div>`;
}
function vSheet(){
  if(!st.sheet)return "";
  const W=weeks();
  return `<div class="sheet"><button data-close aria-label="Schließen"></button><div class="p" role="dialog" aria-label="Woche wählen">
  <div class="h"><h2>Woche wählen</h2><button data-close>Fertig</button></div><div class="l">${W.map(w=>{
    const s=!w.items.length?"frei":w.past?(w.open?w.open+" offen":"erledigt"):w.now?`${w.done} von ${w.tasks.length}`:`${w.tasks.length} Aufgaben`;
    return `<button class="wr" data-go="${w.k}" data-close><span class="a"><b class="${w.k===st.wi?"on":""}">${w.label}${w.now?" · jetzt":""}</b><small>${w.range}</small></span><span class="${w.past&&w.open?"late":""}">${s}</span></button>`;}).join("")}</div></div></div>`;
}

/* ---------- Rahmen ---------- */
const view=()=>location.hash==="#zeitplan"?"zeit":location.hash==="#verlauf"?"verlauf":"next";
const WIDE=window.matchMedia("(min-width:1000px)");
const wide=()=>WIDE.matches;
function render(){
  const v=view();const m=$("#main");const top=m.scrollTop;const w=wide();
  m.className="main"+(w?" wide":v==="zeit"?" zp":"");
  m.innerHTML=w?`<div class="cols"><div class="colL">${v==="verlauf"?vVerlauf():vNext()}</div><div class="colR">${vZeit()}</div></div>`
    :v==="zeit"?vZeit():v==="verlauf"?vVerlauf():vNext();
  $("#n1").toggleAttribute("aria-current",v!=="zeit");$("#n2").toggleAttribute("aria-current",v==="zeit");
  if(v==="zeit")$("#n2").setAttribute("aria-current","page");else $("#n1").setAttribute("aria-current","page");
  $("#ov").innerHTML=(v==="zeit"||w?vSheet():"")+(v!=="zeit"||w?vOd():"")+vAsk();$("#mini").innerHTML=w&&v!=="verlauf"?"":vMini();
  m.scrollTop=top;
}
let toastT;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),1800);}
function setZp(id,on){
  const z=zpById(id);if(!z)return;const at=on?TODAY():"";
  z.status=on?"erledigt":"offen";z.erledigt_am=at;
  st.queue.push({t:"zp",id:String(id),fields:{status:z.status,erledigt_am:at}});
  st.rows.filter(r=>String(r.baustein)===String(id)&&isDone(r)!==on).forEach(r=>{r.status=on?"erledigt":"offen";r.erledigt_am=at;st.queue.push({t:"plan",id:String(r.id),fields:{status:r.status,erledigt_am:at}});});
}
function askFor(x){ // nach dem Abhaken ohne Uhr nach der Dauer fragen
  if(segsFor(x).length)return;
  st.ask={ref:x._zpItem?"zp:"+x.id:String(x.id),titel:x.schritt||x.titel||"",kurs:x.kurs||""};st.other=false;}
function commit(on){save();render();if(on&&!st.ask)toast("Erledigt");sync().then(ok=>{if(ok===false&&st.net!=="key")toast("Gespeichert, wird übertragen, sobald online");});}
function itemById(id){if(String(id).startsWith("zp:")){const z=zpById(String(id).slice(3));return z?Object.assign({_zpItem:true},z,{schritt:z.titel}):null;}return st.rows.find(x=>String(x.id)===String(id));}
function markDone(id){if(String(id).startsWith("zp:")){setZp(String(id).slice(3),true);return;}const r=st.rows.find(x=>String(x.id)===String(id));if(!r)return;
  r.status="erledigt";r.erledigt_am=TODAY();st.queue.push({t:"plan",id:String(r.id),fields:{status:"erledigt",erledigt_am:r.erledigt_am}});if(r.baustein&&zpById(r.baustein))setZp(r.baustein,true);}
document.addEventListener("click",e=>{
  const q=s=>e.target.closest(s);
  let el;
  if(el=q("[data-start]")){const x=itemById(el.dataset.start);if(x){startFor(x);save();render();sync();}return;}
  if(q("[data-pause]")){if(stopRunning()){save();render();toast("Pausiert");sync();}return;}
  if(el=q("[data-fertig]")){stopRunning();markDone(el.dataset.fertig);commit(true);return;}
  if(el=q("[data-min]")){addManual(st.ask,+el.dataset.min);st.ask=null;commit(true);return;}
  if(q("[data-other]")){st.other=true;render();const i=$("#othmin")||$("#othtime");if(i)i.focus();return;}
  if(q("[data-othsave]")){const v=+($("#othmin").value||0);if(v>0){addManual(st.ask,Math.round(v));st.ask=null;st.other=false;commit(true);}return;}
  if(q("[data-skip]")){st.ask=null;st.other=false;render();toast("Erledigt");return;}
  if(el=q("[data-end]")){const r=running();if(r){r.ende=+el.dataset.end;pushSeg(r);st.other=false;save();render();sync();}return;}
  if(q("[data-endsave]")){const r=running();const v=($("#othtime").value||"");if(r&&/^\d\d:\d\d$/.test(v)){const s0=new Date(num(r.start));const d=new Date(s0);d.setHours(+v.slice(0,2),+v.slice(3),0,0);if(d<s0)d.setDate(d.getDate()+1);if(d.getTime()>Date.now())return;r.ende=d.getTime();pushSeg(r);st.other=false;save();render();sync();}return;}
  if(q("[data-keep]")){const r=running();try{if(r)sessionStorage.setItem("keep-"+r.id,"1");}catch(_){}st.other=false;render();return;}
  if(el=q("[data-day]")){st.sel=+el.dataset.day;const key=iso(addD(new Date(),-(13-st.sel)));st.days[key]=true;if(!st.allDays&&Math.round((new Date()-day(key))/864e5)>=10)st.allDays=true;render();const n=document.getElementById("d-"+key);if(n)n.scrollIntoView({behavior:"smooth",block:"center"});return;}
  if(el=q("[data-dayt]")){const k=el.dataset.dayt;st.days[k]=!st.days[k];render();return;}
  if(q("[data-alldays]")){st.allDays=!st.allDays;render();return;}
  if(e.target.closest("[data-open]")){st.open=!st.open;render();return;}
  if(q("[data-od]")){st.odOpen=true;render();return;}
  if(q("[data-odclose]")){st.odOpen=false;render();return;}
  if(q("[data-retry]")){st.net="";render();sync().then(ok=>{if(!ok&&st.net!=="key")toast("Noch keine Verbindung");});return;}
  const g=e.target.closest("[data-go]");if(g&&!g.disabled){st.wi=+g.dataset.go;if(g.hasAttribute("data-close"))st.sheet=false;render();$("#main").scrollTop=0;return;}
  if(e.target.closest("[data-sheet]")){st.sheet=true;render();return;}
  if(e.target.closest("[data-close]")){st.sheet=false;render();return;}
  const zb=e.target.closest("[data-zp]");
  if(zb){const z=zpById(zb.dataset.zp);if(!z)return;const on=!zpDone(z);setZp(z.id,on);if(on)askFor(Object.assign({_zpItem:true},z));commit(on);return;}
  const b=e.target.closest("[data-tog]");if(!b)return;
  const id=b.dataset.tog;
  if(id.startsWith("zp:")){const z=zpById(id.slice(3));setZp(id.slice(3),true);if(z)askFor(Object.assign({_zpItem:true},z));commit(true);return;}
  const r=st.rows.find(x=>String(x.id)===id);if(!r)return;
  const on=!isDone(r);r.status=on?"erledigt":"offen";r.erledigt_am=on?TODAY():"";
  st.queue.push({t:"plan",id:String(r.id),fields:{status:r.status,erledigt_am:r.erledigt_am}});
  if(r.baustein&&zpById(r.baustein))setZp(r.baustein,on);
  if(on)askFor(r);
  commit(on);
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="keyf")return;e.preventDefault();
  let v=($("#keyin").value||"").trim();const m=/[?&]k=([^&#\s]+)/.exec(v);if(m)v=m[1];
  if(!v)return;st.key=v;try{localStorage.setItem("hub-key",v);}catch(_){}
  st.net="";render();sync().then(ok=>toast(ok?"Verbunden":"Schlüssel passt nicht"));
});
/* Zum Aktualisieren herunterziehen */
(function(){
  const m=$("#main"),p=$("#ptr"),MAX=90,GO=64;let y0=null,dy=0,busy=false;
  const set=(d,anim)=>{m.style.transition=p.style.transition=anim?"transform .25s ease, opacity .25s":"none";
    m.style.transform=d?`translateY(${d*0.6}px)`:"";p.style.transform=`translateY(${Math.min(d,MAX)-60}px) rotate(${d*3}deg)`;p.style.opacity=Math.min(1,d/GO);};
  m.addEventListener("touchcancel",()=>{if(y0==null||busy)return;y0=null;dy=0;set(0,true);});
  m.addEventListener("touchstart",e=>{if(busy||m.scrollTop>0||st.sheet||st.odOpen){y0=null;return;}y0=e.touches[0].clientY;dy=0;},{passive:true});
  m.addEventListener("touchmove",e=>{if(y0==null)return;const d=e.touches[0].clientY-y0;if(d<=0||m.scrollTop>0){if(dy)set(0);dy=0;return;}
    dy=Math.min(MAX*1.4,d*0.55);set(dy);if(e.cancelable)e.preventDefault();},{passive:false});
  m.addEventListener("touchend",async()=>{if(y0==null)return;y0=null;
    if(dy<GO){set(0,true);dy=0;return;}
    busy=true;set(GO,true);p.classList.add("spin");
    try{if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistration();if(r)r.update();}}catch(_){}
    if(await checkVersion())return;
    const ok=await sync();p.classList.remove("spin");set(0,true);dy=0;busy=false;
    toast(ok?"Aktuell":st.net==="key"?"Schlüssel fehlt":"Offline, später nochmal versuchen");});
})();
/* Escape schließt das offene Fenster unten */
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(st.ask){st.ask=null;st.other=false;render();toast("Erledigt");return;}
  if(st.odOpen||st.sheet){st.odOpen=false;st.sheet=false;render();}
});
WIDE.addEventListener("change",()=>render());
window.addEventListener("online",()=>sync());
window.addEventListener("offline",()=>{if(st.net!=="key"){st.net="off";render();}});
window.addEventListener("hashchange",()=>{st.sheet=false;st.odOpen=false;st.sel=null;st.days={};st.allDays=false;render();$("#main").scrollTop=0;});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){checkVersion();sync();}});
setInterval(()=>{if(document.visibilityState==="visible")sync();},300000);
setInterval(()=>{document.querySelectorAll("[data-clock]").forEach(el=>{el.textContent=fmtClock(Date.now()-(+el.dataset.clock));});},1000);
render();sync();checkVersion();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
