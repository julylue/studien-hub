<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studium">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121414" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Studium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap">
<style>
/* Eine Seite, vier Fragen von oben nach unten: Was jetzt? Wie läuft die Woche? Wo stehe ich je Kurs? Was habe ich geschafft?
   Bedeutung trägt die Form (Balken, Punkte, Markierung), Text nur als Beschriftung. */
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#1b1d1f; --muted:#6f7378; --faint:#a9adb2; --line:#e6e3dd; --track:#ebe8e2;
  --ok:#2f8f6a; --ok-soft:#e1f1ea; --warn:#c9822b; --warn-soft:#f8ecdc; --bad:#c4553f; --bad-soft:#f7e3de;
  --c-Psy:#5b6fd6; --c-Stat:#2f8f8a; --c-FoM:#b4689c; --c-KuV:#c48a3a; --c-WisA:#7b8794;
  --shadow:0 1px 2px rgba(27,29,31,.04),0 10px 30px -12px rgba(27,29,31,.14);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121414; --card:#1b1e1f; --ink:#eceeef; --muted:#9aa0a5; --faint:#5f666b; --line:#2a2e30; --track:#262a2c;
  --ok:#5cc49a; --ok-soft:#173329; --warn:#e3a457; --warn-soft:#352816; --bad:#e8826c; --bad-soft:#3a1f19;
  --c-Psy:#8b9cf2; --c-Stat:#5cc2bc; --c-FoM:#d993c2; --c-KuV:#e0ad63; --c-WisA:#a3adb8;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121414; --card:#1b1e1f; --ink:#eceeef; --muted:#9aa0a5; --faint:#5f666b; --line:#2a2e30; --track:#262a2c;
  --ok:#5cc49a; --ok-soft:#173329; --warn:#e3a457; --warn-soft:#352816; --bad:#e8826c; --bad-soft:#3a1f19;
  --c-Psy:#8b9cf2; --c-Stat:#5cc2bc; --c-FoM:#d993c2; --c-KuV:#e0ad63; --c-WisA:#a3adb8;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 2px}
.top .wk{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.on{background:var(--ok)} .dot.busy{background:var(--warn)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--track);color:var(--muted);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.ok{background:var(--ok-soft);color:var(--ok)}

/* Jetzt */
.hero{padding:20px 20px 18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cc,var(--faint))}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hero .sub{margin:8px 0 0;color:var(--muted);font-size:15px}
.hero h1{margin:0;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.hero .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.done-btn{display:inline-flex;align-items:center;gap:10px;padding:13px 18px 13px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800;font-size:15px}
.done-btn svg{width:22px;height:22px}
.next{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.empty{color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:4px}

/* Zeilen mit Haken */
.it{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.it+.it{border-top:1px solid var(--line)}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;transition:background .15s,border-color .15s}
.tick svg{width:14px;height:14px;opacity:0}
.it.done .tick{background:var(--ok);border-color:var(--ok)} .it.done .tick svg{opacity:1;color:#fff}
.it .tx{flex:1;min-width:0}
.it .t{font-weight:600;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.done .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.it .m{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:2px}
.it .m i{width:7px;height:7px;border-radius:50%}
.it .m .late{color:var(--bad);font-weight:700}
.it .m .z{color:var(--faint)}

/* Woche */
.wkhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wkhead .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.wkhead .big small{font-size:16px;color:var(--muted);font-weight:700;margin-left:4px}
.segs{display:flex;gap:5px;margin:14px 0 6px}
.seg{flex:1;height:12px;border-radius:6px;background:var(--track);position:relative;overflow:hidden}
.seg.on{background:var(--sc)}
.seg.late{background:transparent;box-shadow:inset 0 0 0 2px var(--bad)}
.seg.today::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 2px var(--ink);opacity:.25}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--track)}
.legend b.l{background:transparent;box-shadow:inset 0 0 0 2px var(--bad)}
.more{margin-top:12px;font-size:14px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.more svg{width:16px;height:16px;transition:transform .2s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.list{margin-top:6px}

/* Kurse */
.course{display:grid;grid-template-columns:88px 1fr 46px;align-items:center;gap:12px;padding:9px 0}
.course+.course{border-top:1px solid var(--line)}
.course .n{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.course .n i{width:8px;height:8px;border-radius:50%;flex:none}
.bar{position:relative;height:10px;border-radius:5px;background:var(--track)}
.bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--fc)}
.bar .gap{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--gc) 0 3px,transparent 3px 7px);opacity:.55;border-radius:0 5px 5px 0}
.bar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink)}
.course .s{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.course .s.ok{color:var(--ok)} .course .s.warn{color:var(--warn)} .course .s.bad{color:var(--bad)}
.course .sub{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px;display:flex;gap:8px;align-items:center}
.keyrow{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.keyrow span{display:inline-flex;align-items:center;gap:6px}
.keyrow .mk{width:2px;height:12px;background:var(--ink);border-radius:1px}
.keyrow .hb{width:14px;height:8px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--bad) 0 2px,transparent 2px 5px);opacity:.7}

/* Fristen */
.dl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.dl::-webkit-scrollbar{display:none}
.dlc{flex:none;min-width:112px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.dlc .d{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.dlc .d small{font-size:12px;font-weight:700;color:var(--muted);margin-left:3px}
.dlc .w{font-size:12px;font-weight:600;margin-top:6px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dlc .w i{width:7px;height:7px;border-radius:50%}
.dlc.soon{background:var(--warn-soft);border-color:transparent} .dlc.soon .d{color:var(--warn)}
.dlc.now{background:var(--bad-soft);border-color:transparent} .dlc.now .d{color:var(--bad)}

.recent .it{padding:8px 0}
.recent .it.done .t{color:var(--ink);text-decoration:none}
.recent .when{font-size:12px;color:var(--muted);flex:none}
.note{font-size:13px;color:var(--muted);text-align:center;padding:6px 10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* Datenquelle: Google-Tabelle "Studien-Hub Wochenplan" über das Skript "Studien-Hub Schnittstelle".
   Der Schlüssel kommt nur über den persönlichen Link (?k=...) und bleibt im Gerät. */
const API="https://script.google.com/macros/s/AKfycby527965MYC7xpuzDuMsJ867wvj5lUO3fpVItky-bHpHem6PknQ8ef4VaiV6KrKQ87t/exec";
const KURS={Psy:"Psychologie",Stat:"Statistik",FoM:"Forschungsmethoden",KuV:"Kulturelle Vielfalt",WisA:"Wiss. Arbeiten"};
const ORDER=["Psy","Stat","FoM","KuV","WisA"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st={rows:[],kurse:[],links:{},queue:[],key:"",net:"",open:false};
(function(){
  let k="";try{k=new URLSearchParams(location.search).get("k")||"";}catch(e){}
  try{if(k)localStorage.setItem("hub-key",k);else k=localStorage.getItem("hub-key")||"";}catch(e){}
  st.key=k;
  try{const c=JSON.parse(localStorage.getItem("hub2-cache")||"null");if(c){st.rows=c.rows||[];st.kurse=c.kurse||[];st.links=c.links||{};st.queue=c.queue||[];}}catch(e){}
})();
function save(){try{localStorage.setItem("hub2-cache",JSON.stringify({rows:st.rows,kurse:st.kurse,links:st.links,queue:st.queue}));}catch(e){}}
let chain=Promise.resolve();
function sync(){
  chain=chain.then(async()=>{
    if(!st.key){st.net="key";render();return false;}
    st.net="busy";paintDot();
    const ops=st.queue.slice();
    try{
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({k:st.key,ops,data:false})});
      const j=await r.json();if(!j.ok)throw new Error(j.error||"api");
      st.queue=st.queue.slice(ops.length);
      st.rows=j.plan||[];if(j.kurse)st.kurse=j.kurse;st.links=j.links||{};st.net="ok";save();render();return true;
    }catch(e){st.net=e&&e.message==="key"?"key":"off";paintDot();return false;}
  });
  return chain;
}

/* ---------- Zeit ---------- */
const iso=d=>{const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
const day=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||""));return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const days=(a,b)=>Math.round((a-b)/864e5);
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
function when(s){const d=day(s);if(!d)return "";const n=days(d,today());
  if(n===0)return "heute";if(n===1)return "morgen";if(n===-1)return "gestern";
  if(n>1&&n<7)return WD[d.getDay()];return `${d.getDate()}.${d.getMonth()+1}.`;}
function kw(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7);}

/* ---------- Auswahl ---------- */
const isDone=r=>/^erledigt$/i.test(String(r.status||"").trim());
const isRec=r=>/^(ja|yes|x|1|true)$/i.test(String(r.empfohlen||"").trim());
const isZ=r=>/zusatz/i.test(r.prioritaet||"");
const late=r=>!isDone(r)&&day(r.faellig)&&day(r.faellig)<today();
const byDue=(a,b)=>String(a.faellig||"9").localeCompare(String(b.faellig||"9"));
function weekRows(){const a=iso(monday(new Date())),b=iso(addD(monday(new Date()),6));
  return st.rows.filter(r=>{const w=String(r.woche||"").slice(0,10);return w>=a&&w<=b;});}
function carried(){const a=iso(monday(new Date()));return st.rows.filter(r=>!isDone(r)&&String(r.woche||"").slice(0,10)<a&&!isZ(r));}
function nextUp(){
  const open=st.rows.filter(r=>!isDone(r));
  const rec=open.filter(isRec).sort(byDue);
  const rest=open.filter(r=>!isRec(r)&&!isZ(r)).sort(byDue);
  return rec.concat(rest);
}

/* ---------- Bausteine der Ansicht ---------- */
const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  ring:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M7.5 12.3l3 3 6-6.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
};
const cc=k=>`var(--c-${KURS[k]?k:"WisA"})`;
function dueChip(r){if(!r.faellig)return "";const n=days(day(r.faellig),today());
  const t=n<0?`${-n} ${-n===1?"Tag":"Tage"} drüber`:n===0?"heute":n===1?"morgen":`bis ${when(r.faellig)}`;
  return `<span class="chip ${n<0?"bad":n<=1?"warn":""}">${t}</span>`;}
function item(r,extra){
  const d=isDone(r);
  const meta=[`<i style="background:${cc(r.kurs)}"></i>${esc(r.kurs||"")}`];
  if(extra==="recent"){}
  else if(late(r))meta.push(`<span class="late">${esc(when(r.faellig))} fällig</span>`);
  else if(r.faellig&&!d)meta.push(esc(when(r.faellig)));
  if(isZ(r))meta.push(`<span class="z">Zusatz</span>`);
  return `<button class="it ${d?"done":""}" data-tog="${esc(r.id)}"><span class="tick">${ICON.check}</span><span class="tx"><span class="t">${esc(r.schritt)}</span><span class="m">${meta.join(" · ")}</span></span>${extra==="recent"?`<span class="when">${esc(when(r.erledigt_am))}</span>`:""}</button>`;
}
function vHero(){
  const q=nextUp();const h=q[0];
  if(!st.rows.length)return `<section class="card hero"><p class="lbl">Jetzt</p><div class="empty"><b>Noch kein Wochenplan</b>${st.key?"Er erscheint, sobald Claude ihn einträgt.":"Öffne den Hub einmal über deinen persönlichen Link."}</div></section>`;
  if(!h)return `<section class="card hero" style="--cc:var(--ok)"><p class="lbl">Jetzt</p><div class="empty"><b>Alles erledigt</b>Für diese Woche ist nichts mehr offen.</div></section>`;
  const after=q.slice(1,3);
  return `<section class="card hero" style="--cc:${cc(h.kurs)}">
    <div class="chips"><span class="chip"><i style="background:${cc(h.kurs)}"></i>${esc(KURS[h.kurs]||h.kurs||"")}</span>${dueChip(h)}${isZ(h)?`<span class="chip">Zusatz</span>`:""}</div>
    <h1>${esc(h.schritt)}</h1>${h.notiz?`<p class="sub">${esc(h.notiz)}</p>`:""}
    <div class="row"><button class="done-btn" data-tog="${esc(h.id)}">${ICON.ring}Erledigt</button></div>
    ${after.length?`<div class="next">${after.map(r=>item(r)).join("")}</div>`:""}
  </section>`;
}
function vWeek(){
  const rows=weekRows();const pf=rows.filter(r=>!isZ(r)).sort((a,b)=>(isDone(b)-isDone(a))||byDue(a,b));
  const old=carried();
  if(!rows.length&&!old.length)return "";
  const done=pf.filter(isDone).length;
  const t=iso(today());
  const segs=pf.map(r=>{const d=isDone(r),l=late(r);return `<span class="seg ${d?"on":""} ${l?"late":""} ${!d&&String(r.faellig).slice(0,10)===t?"today":""}" style="--sc:${cc(r.kurs)}"></span>`;}).join("");
  const nLate=pf.filter(late).length+old.length;
  const state=nLate?`<span class="chip bad">${nLate} überfällig</span>`:`<span class="chip ok">Woche im Plan</span>`;
  const list=st.open?`<div class="list">${old.map(r=>item(r)).join("")}${rows.slice().sort((a,b)=>(isDone(a)-isDone(b))||(isZ(a)-isZ(b))||byDue(a,b)).map(r=>item(r)).join("")}</div>`:"";
  return `<section class="card"><p class="lbl">Diese Woche · Pflicht</p>
    <div class="wkhead"><span class="big">${done}<small>von ${pf.length}</small></span>${state}</div>
    <div class="segs">${segs}</div>
    ${nLate?`<div class="legend"><span><b class="l"></b>überfällig</span></div>`:""}
    <button class="more" data-open aria-expanded="${st.open}">${st.open?"Weniger":"Alle Schritte"}${ICON.down}</button>${list}
  </section>`;
}
function vCourses(){
  if(!st.kurse.length)return "";
  const ks=ORDER.map(k=>st.kurse.find(x=>x.kurs===k)).filter(Boolean);
  return `<section class="card"><p class="lbl">Stand je Kurs</p>${ks.map(k=>{
    const g=+k.gesamt||1,e=+k.erledigt||0,s=+k.soll||0,diff=e-s;
    const cls=diff>=0?"ok":(diff>=-2?"warn":"bad");
    const pe=Math.min(100,e/g*100),ps=Math.min(100,s/g*100);
    const gap=ps>pe?`<span class="gap" style="left:${pe}%;width:${ps-pe}%;--gc:var(--${cls==="ok"?"ok":cls})"></span>`:"";
    return `<div class="course"><span class="n"><i style="background:${cc(k.kurs)}"></i>${esc(k.kurs)}</span>
      <div class="bar"><span class="f" style="width:${pe}%;--fc:${cc(k.kurs)}"></span>${gap}<span class="mk" style="left:${ps}%"></span></div>
      <span class="s ${cls}">${diff>=0?"✓":diff}</span></div>`;}).join("")}
    <div class="keyrow"><span><span class="mk"></span>Soll heute</span><span><span class="hb"></span>Rückstand</span><span>Zahl = Bausteine hinter Plan</span></div>
  </section>`;
}
function vDeadlines(){
  const items=[];
  st.kurse.forEach(k=>{if(k.naechste_frist)items.push({d:k.naechste_frist,w:k.frist_was,k:k.kurs});});
  st.rows.filter(r=>!isDone(r)&&/^(Pflicht \(Quiz\/PVL\)|Orga)$/.test(r.art||"")&&r.faellig).forEach(r=>items.push({d:r.faellig,w:r.schritt,k:r.kurs}));
  const seen=new Set();const t=today();
  const list=items.filter(x=>{const d=day(x.d);if(!d||d<t||days(d,t)>45)return false;const key=String(x.d).slice(0,10)+x.k;if(seen.has(key))return false;seen.add(key);return true;}).sort((a,b)=>String(a.d).localeCompare(String(b.d))).slice(0,5);
  if(!list.length)return "";
  return `<section><p class="lbl" style="padding-left:4px">Fristen</p><div class="dl">${list.map(x=>{const n=days(day(x.d),t);
    return `<div class="dlc ${n<=2?"now":n<=7?"soon":""}"><div class="d">${n===0?"heute":n}<small>${n===0?"":n===1?"Tag":"Tage"}</small></div><div class="w"><i style="background:${cc(x.k)}"></i>${esc(short(x.w))}</div></div>`;}).join("")}</div></section>`;
}
const short=s=>{s=String(s||"");s=s.replace(/^(WisA|M2|Stat|Psy|FoM|KuV):?\s*/,"");return s.length>22?s.slice(0,21)+"…":s;};
function vRecent(){
  const r=st.rows.filter(x=>isDone(x)&&x.erledigt_am).sort((a,b)=>String(b.erledigt_am).localeCompare(String(a.erledigt_am))).slice(0,3);
  if(!r.length)return "";
  return `<section class="card recent"><p class="lbl">Zuletzt erledigt</p>${r.map(x=>item(x,"recent")).join("")}</section>`;
}
function paintDot(){const d=$("#dot");if(!d)return;d.className="dot "+(st.net==="ok"?"on":st.net==="busy"?"busy":"");d.title=st.net==="ok"?"Aktuell":st.net==="key"?"Persönlicher Link fehlt":"Offline";}
function render(){
  const mo=monday(new Date());
  $("#app").innerHTML=`<header class="top"><span class="wk">KW ${kw(mo)} · ${mo.getDate()}.${mo.getMonth()+1}.–${addD(mo,6).getDate()}.${addD(mo,6).getMonth()+1}.</span><span class="dot" id="dot"></span></header>
    ${vHero()}${vDeadlines()}${vWeek()}${vCourses()}${vRecent()}
    ${st.net==="key"?`<p class="note">Öffne den Hub einmal über deinen persönlichen Link.</p>`:""}`;
  paintDot();
}
let toastT;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),1800);}

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o){st.open=!st.open;render();return;}
  const b=e.target.closest("[data-tog]");if(!b)return;
  const r=st.rows.find(x=>String(x.id)===b.dataset.tog);if(!r)return;
  const on=!isDone(r);r.status=on?"erledigt":"offen";r.erledigt_am=on?iso(new Date()):"";
  st.queue.push({t:"plan",id:String(r.id),fields:{status:r.status,erledigt_am:r.erledigt_am}});save();
  b.classList.add("pop");setTimeout(render,on?220:0);
  if(on)toast("Erledigt");
  sync().then(ok=>{if(ok===false)toast("Gespeichert, wird übertragen sobald online");});
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync();});
setInterval(()=>{if(document.visibilityState==="visible")sync();},300000);
render();sync();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
